<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login complete</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; text-align: center; }
  code { display: block; word-break: break-all; background: #f2f2f2; padding: 16px; border-radius: 8px; margin: 20px 0; font-size: 0.95rem; text-align: left; }
  button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  .ok { color: #1a7f37; font-weight: bold; }
</style>
</head>
<body>
  <h1>Login complete</h1>
  <p>Copy the code below and paste it back to Claude.</p>
  <code id="code">(reading URL...)</code>
  <button onclick="copyCode()">Copy code</button>
  <p id="status"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const el = document.getElementById('code');
    if (code) {
      el.textContent = code;
    } else if (error) {
      el.textContent = 'Error: ' + error + ' - ' + (params.get('error_description') || '');
    } else {
      el.textContent = 'No code found in URL. Copy the full address bar URL instead.';
    }
    function copyCode() {
      navigator.clipboard.writeText(el.textContent).then(() => {
        document.getElementById('status').innerHTML = '<span class="ok">Copied!</span>';
      });
    }
  </script>
</body>
</html>
